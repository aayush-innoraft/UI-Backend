shopping_cart.products:
  path: '/shopping-cart/products'
  defaults:
    _controller: '\Drupal\shopping_cart\Controller\CartController::productList'
    _title: 'Product List'
  requirements:
    _permission: 'access content'

shopping_cart.add:
  path: '/shopping-cart/add/{id}'
  defaults:
    _controller: '\Drupal\shopping_cart\Controller\CartController::addToCart'
    _title: 'Add to Cart'
  requirements:
    _permission: 'access content'
    id: \d+

shopping_cart.view:
  path: '/shopping-cart/view'
  defaults:
    _controller: '\Drupal\shopping_cart\Controller\CartController::viewCart'
    _title: 'View Cart'
  requirements:
    _permission: 'access content'

shopping_cart.checkout:
  path: '/shopping-cart/checkout'
  defaults:
    _form: '\Drupal\shopping_cart\Form\CheckoutForm'
    _title: 'Checkout'
  requirements:
    _permission: 'access content'

shopping_cart.remove_from_cart:
  path: '/shopping-cart/remove/{id}'
  defaults:
    _controller: '\Drupal\shopping_cart\Controller\CartController::removeFromCart'
    _title: 'Remove from Cart'
  requirements:
    _permission: 'access content'
    id: \d+